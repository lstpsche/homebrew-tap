name: Coding Session History MCP formula
on:
  push:
    paths: [Formula/coding-session-history-mcp.rb, .github/workflows/coding-session-history-mcp.yml]
  pull_request:
    paths: [Formula/coding-session-history-mcp.rb, .github/workflows/coding-session-history-mcp.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formula:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f
      - name: Install and test the checked-out formula
        run: |
          brew style lstpsche/tap/coding-session-history-mcp
          brew audit --strict lstpsche/tap/coding-session-history-mcp
          brew install --build-from-source lstpsche/tap/coding-session-history-mcp
          brew test lstpsche/tap/coding-session-history-mcp
